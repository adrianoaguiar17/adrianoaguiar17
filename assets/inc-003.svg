<svg width="900" height="510" viewBox="0 0 900 510" xmlns="http://www.w3.org/2000/svg">

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                   "Liberation Mono", "Courier New", monospace;
    }

    .step1, .step2, .step3, .step4, .step5, .root, .resolved {
      opacity: 0;
      animation: show .15s linear forwards;
    }

    .step1 { animation-delay: .8s; }
    .step2 { animation-delay: 1.5s; }
    .step3 { animation-delay: 2.2s; }
    .step4 { animation-delay: 2.9s; }
    .step5 { animation-delay: 3.6s; }
    .root { animation-delay: 4.5s; }
    .resolved { animation-delay: 5.5s; }

    .blink { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }

    @keyframes show {
      to { opacity: 1; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }
  </style>

  <rect width="900" height="510" rx="16" fill="#0d1117"/>

  <rect x="1" y="1" width="898" height="508" rx="15"
        fill="none" stroke="#30363d"/>

  <circle cx="28" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="27" r="6" fill="#febc2e"/>
  <circle cx="68" cy="27" r="6" fill="#28c840"/>

  <text x="450" y="32" text-anchor="middle"
        class="mono" font-size="13" fill="#8b949e">
    incident-viewer — INC-003
  </text>

  <line x1="0" y1="52" x2="900" y2="52" stroke="#30363d"/>

  <text x="36" y="90" class="mono" font-size="13" fill="#8b949e">
    INCIDENT
  </text>

  <text x="155" y="90" class="mono" font-size="13" fill="#f0f6fc">
    INC-003
  </text>

  <text x="36" y="116" class="mono" font-size="13" fill="#8b949e">
    STATUS
  </text>

  <circle cx="160" cy="112" r="5" fill="#3fb950" class="pulse"/>

  <text x="174" y="116" class="mono" font-size="13" fill="#3fb950">
    RESOLVED
  </text>

  <text x="36" y="142" class="mono" font-size="13" fill="#8b949e">
    SEVERITY
  </text>

  <text x="155" y="142" class="mono" font-size="13" fill="#f85149">
    HIGH
  </text>

  <text x="36" y="168" class="mono" font-size="13" fill="#8b949e">
    CATEGORY
  </text>

  <text x="155" y="168" class="mono" font-size="13" fill="#f0f6fc">
    Payments / Data Consistency
  </text>

  <text x="36" y="213" class="mono" font-size="21"
        font-weight="700" fill="#f0f6fc">
    Payment Status Mismatch
  </text>

  <text x="36" y="253" class="mono" font-size="14" fill="#58a6ff">
    &gt; run investigation
  </text>

  <text x="56" y="291" class="mono step1" font-size="13" fill="#c9d1d9">
    check_payment_provider
  </text>

  <text x="330" y="291" class="mono step1" font-size="13" fill="#3fb950">
    [ PAID ]
  </text>

  <text x="56" y="319" class="mono step2" font-size="13" fill="#c9d1d9">
    inspect_webhook
  </text>

  <text x="330" y="319" class="mono step2" font-size="13" fill="#3fb950">
    [ OK ]
  </text>

  <text x="56" y="347" class="mono step3" font-size="13" fill="#c9d1d9">
    inspect_application
  </text>

  <text x="330" y="347" class="mono step3" font-size="13" fill="#d29922">
    [ PENDING ]
  </text>

  <text x="470" y="291" class="mono step4" font-size="13" fill="#c9d1d9">
    query_database
  </text>

  <text x="730" y="291" class="mono step4" font-size="13" fill="#d29922">
    [ FOUND ]
  </text>

  <text x="470" y="319" class="mono step5" font-size="13" fill="#c9d1d9">
    compare_identifiers
  </text>

  <text x="730" y="319" class="mono step5" font-size="13" fill="#f85149">
    [ MISMATCH ]
  </text>

  <text x="56" y="393" class="mono root" font-size="13"
        font-weight="700" fill="#f85149">
    ROOT CAUSE FOUND
  </text>

  <text x="56" y="420" class="mono root" font-size="13" fill="#c9d1d9">
    Webhook payment ID did not match the internal transaction ID.
  </text>

  <text x="56" y="464" class="mono resolved" font-size="14"
        font-weight="700" fill="#3fb950">
    INCIDENT STATUS: RESOLVED
  </text>

  <rect x="282" y="451" width="9" height="16" rx="1"
        fill="#58a6ff" class="resolved blink"/>

</svg>
