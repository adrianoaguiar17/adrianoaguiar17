<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .blink {
      animation: blink 1s steps(1) infinite;
    }

    .type1,
    .type2,
    .type3,
    .type4,
    .type5,
    .type6,
    .type7 {
      opacity: 0;
      animation-fill-mode: forwards;
    }

    .type1 { animation: show 0.1s linear 0.6s forwards; }
    .type2 { animation: show 0.1s linear 1.5s forwards; }
    .type3 { animation: show 0.1s linear 2.4s forwards; }
    .type4 { animation: show 0.1s linear 3.3s forwards; }
    .type5 { animation: show 0.1s linear 4.2s forwards; }
    .type6 { animation: show 0.1s linear 5.1s forwards; }
    .type7 { animation: show 0.1s linear 6.2s forwards; }

    .pulse {
      animation: pulse 1.4s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes show {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="500" rx="16" fill="#0d1117"/>

  <rect
    x="1"
    y="1"
    width="898"
    height="498"
    rx="15"
    fill="none"
    stroke="#30363d"
  />

  <!-- Window controls -->
  <circle cx="28" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="27" r="6" fill="#febc2e"/>
  <circle cx="68" cy="27" r="6" fill="#28c840"/>

  <text
    x="450"
    y="32"
    text-anchor="middle"
    class="mono"
    font-size="13"
    fill="#8b949e">
    adriano-support-console
  </text>

  <line
    x1="0"
    y1="52"
    x2="900"
    y2="52"
    stroke="#30363d"
  />

  <!-- Prompt -->
  <text x="36" y="92" class="mono" font-size="16" fill="#58a6ff">
    adriano@support
  </text>

  <text x="165" y="92" class="mono" font-size="16" fill="#8b949e">
    ~ %
  </text>

  <text x="205" y="92" class="mono" font-size="16" fill="#f0f6fc">
    whoami
  </text>

  <!-- Main identity -->
  <text
    x="36"
    y="132"
    class="mono"
    font-size="20"
    font-weight="700"
    fill="#f0f6fc">
    Technical Support with a builder's mindset
  </text>

  <text
    x="36"
    y="160"
    class="mono"
    font-size="14"
    fill="#8b949e">
    SaaS · APIs · Integrations · Troubleshooting
  </text>

  <!-- Profile information -->
  <text x="36" y="205" class="mono" font-size="13" fill="#8b949e">
    LOCATION
  </text>

  <text x="165" y="205" class="mono" font-size="13" fill="#f0f6fc">
    Dublin, Ireland
  </text>

  <text x="36" y="232" class="mono" font-size="13" fill="#8b949e">
    STATUS
  </text>

  <circle cx="171" cy="228" r="5" fill="#3fb950" class="pulse"/>

  <text x="185" y="232" class="mono" font-size="13" fill="#3fb950">
    ONLINE
  </text>

  <text x="36" y="259" class="mono" font-size="13" fill="#8b949e">
    CURRENT FOCUS
  </text>

  <text x="165" y="259" class="mono" font-size="13" fill="#f0f6fc">
    Technical Support
  </text>

  <!-- Animated command -->
  <text x="36" y="307" class="mono" font-size="14" fill="#58a6ff">
    &gt;
  </text>

  <text x="55" y="307" class="mono type1" font-size="14" fill="#58a6ff">
    system_check
  </text>

  <!-- First check -->
  <text x="56" y="345" class="mono type2" font-size="13" fill="#c9d1d9">
    REST APIs
  </text>

  <text x="240" y="345" class="mono type2" font-size="13" fill="#3fb950">
    [ OK ]
  </text>

  <!-- Second check -->
  <text x="56" y="373" class="mono type3" font-size="13" fill="#c9d1d9">
    Webhooks
  </text>

  <text x="240" y="373" class="mono type3" font-size="13" fill="#3fb950">
    [ OK ]
  </text>

  <!-- Third check -->
  <text x="430" y="345" class="mono type4" font-size="13" fill="#c9d1d9">
    PostgreSQL
  </text>

  <text x="650" y="345" class="mono type4" font-size="13" fill="#3fb950">
    [ OK ]
  </text>

  <!-- Fourth check -->
  <text x="430" y="373" class="mono type5" font-size="13" fill="#c9d1d9">
    Automation
  </text>

  <text x="650" y="373" class="mono type5" font-size="13" fill="#3fb950">
    [ OK ]
  </text>

  <!-- Fifth check -->
  <text x="56" y="415" class="mono type6" font-size="13" fill="#c9d1d9">
    Troubleshooting
  </text>

  <text x="240" y="415" class="mono type6" font-size="13" fill="#3fb950">
    [ READY ]
  </text>

  <!-- Final status -->
  <text
    x="56"
    y="458"
    class="mono type7"
    font-size="14"
    font-weight="700"
    fill="#3fb950">
    SUPPORT CONSOLE READY
  </text>

  <!-- Cursor -->
  <rect
    x="268"
    y="445"
    width="9"
    height="16"
    rx="1"
    fill="#58a6ff"
    class="blink type7"
  />

</svg>
